<!doctype html>
<meta charset="utf-8">
<title>Contented Livestock — showcase</title>
<!--
  Engraves the mod name and its summary line onto the showcase, to the repository
  standard in STYLE_RIMWORLD.md: 896x504, title over the calm upper-left third,
  58x3 amber rule, 21 px summary on 430 px.

  Rendered by Chrome headless at the final size, so the glyphs are never
  resampled. The background is Art/Preview-source.png, the full-resolution
  render, never the reduced Preview.png.

    chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
      --window-size=896,504 --force-device-scale-factor=1 \
      --screenshot=../Mod/About/Preview.png preview.html

  The source is 1536x1024, which is 3:2, so it has to lose 160 rows to reach
  16:9. They are taken off the BOTTOM, hence `top center` rather than `center`:
  the bottom strip is empty floor, while the top band carries the frozen ground
  outside the fence and the settler walking away with the second pail - the two
  things that say the shelter is a choice and that the milk goes somewhere.

  The title is set on two lines. One line of "Contented Livestock" would reach
  x=545 and cross the fence, which is the one mid-toned horizontal band in the
  upper half; two lines keep every glyph over the frozen ground and the dark
  lean-to roof, which is what the calm upper-left third is for.
-->
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 896px; height: 504px; position: relative; overflow: hidden; }

  .scene {
    position: absolute; inset: 0;
    background: url('../Art/Preview-source.png') top center / cover no-repeat;
  }

  /*
    Darkens the upper-left third so the text reads, and leaves the lit cow alone.

    The colour is #242838, sampled off the frozen ground beyond the fence in
    Art/Preview-source.png - averaged over two patches that came back #212532 and
    #272a38. The style guide asks for one notch of desaturation after sampling,
    which is a no-op here: at S 0.22 the sample is already the least saturated
    thing in the picture. It is also the right one to take. The veil colour
    becomes the colour of this third of the showcase, and what belongs there is
    the cold the shelter is keeping out, not the warmth of the heater pool -
    which is one of the two things allowed to be vivid and would have spent that
    budget on a flat.

    Its relative luminance is 0.022, well under the 0.18 the guide sets, so the
    ink is the light one and the drop shadows stay: they lift the glyphs off the
    ground that shows through. The rule keeps its amber, which the guide only
    gives up when the veil is itself amber or orange.

    Footprint: the guide's dark form is a circle falling to nothing at 74%, which
    on this picture also swallows the green pasture in the lower left - the other
    of the two vivid things, and the one that says what the animal is being fed.
    Flattened into an ellipse instead, wide enough to cover the whole text block
    and short enough to release the pasture. The acceptance test is the same
    either way, and it is measured on the rendered PNG: 4.5:1 at the worst of the
    four corners of the text block. The worst of the four here is 7.8:1, behind the end of the summary
    where the lean-to roof lifts the ground out from under it.
  */
  .veil {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 900px 430px at top left,
                rgba(36, 40, 56, .88) 0%, rgba(36, 40, 56, 0) 100%);
  }

  .plate {
    position: absolute; left: 50px; top: 46px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .name {
    margin: 0; font-size: 52px; font-weight: 700; line-height: 1;
    color: #F2ECE1; letter-spacing: -1px;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
  }

  .rule {
    width: 58px; height: 3px; margin: 18px 0 0; background: #D68F2C;
  }

  .line {
    margin: 13px 0 0; width: 430px;
    font-size: 21px; line-height: 29px; font-weight: 400;
    color: #D8CFC0;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .6);
  }
</style>

<div class="scene"></div>
<div class="veil"></div>
<div class="plate">
  <p class="name">Contented<br>Livestock</p>
  <div class="rule"></div>
  <p class="line">How you keep an animal decides what it gives you.</p>
</div>
